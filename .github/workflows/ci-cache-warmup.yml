name: Warm shared CI caches

on:
  # Cache-input pushes seed immediately; this schedule repairs eviction and image changes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cache-warmup-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  warm:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    concurrency:
      group: ci-cache-warmup-linux-x64-${{ matrix.runner }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name != 'schedule' }}
    # Blacksmith and GitHub-hosted jobs restore from separate cache stores; warm both.
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.repository == 'stablyai/orca' && '["blacksmith-4vcpu-ubuntu-2404","ubuntu-24.04"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Default-branch caches can be restored by every PR; PR caches cannot.
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-electron-package: 'true'
          # No hosted job restores the root store, so keep it out of GitHub's cache quota.
          cache-pnpm-store: ${{ startsWith(matrix.runner, 'blacksmith-') }}
          cache-pnpm-store-lookup-only: 'true'

      - uses: ./.github/actions/prepare-headless-compiler
        with:
          seed: 'true'

      - name: Populate shared Electron archive
        run: node config/scripts/install-electron-package-binary.mjs

      - uses: ./.github/actions/prepare-git-compatibility

      - uses: ./.github/actions/prepare-wayland-clipboard
        with:
          save-cache: 'true'

  warm-platforms:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci-cache-warmup-platform-jobs.yml
